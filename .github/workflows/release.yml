name: Release

# Building and publishing happens only from main, and only when the version in
# hwmon/__init__.py changes. Merging a PR that bumps the version is therefore
# the single action that cuts a release.
on:
  push:
    branches: [main]
    paths:
      - "hwmon/__init__.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' hwmon/__init__.py | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists, skipping."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION is new."
          fi

  test:
    name: test
    needs: version
    if: needs.version.outputs.is_new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest tests -v

  build:
    name: build and publish
    needs: [version, test]
    if: needs.version.outputs.is_new == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file executable
        run: python build_release.py

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/LiquidGlassMon.exe -Algorithm SHA256).Hash.ToLower()
          "$h  LiquidGlassMon.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Write-Output "sha256: $h"
          Write-Output "size: $((Get-Item dist/LiquidGlassMon.exe).Length) bytes"

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassMon-${{ needs.version.outputs.version }}
          path: |
            dist/LiquidGlassMon.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: 液态玻璃硬件监控 v${{ needs.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/LiquidGlassMon.exe
            dist/SHA256SUMS.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
